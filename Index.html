<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You Are An Idiot!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #ffffff;
      color: #000000;
      font-family: "Comic Sans MS", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    body.inverted {
      background: #000000;
      color: #ffffff;
    }
    .popup {
      position: absolute;
      width: 260px;
      height: 170px;
      border: 3px solid #000080;
      background: #ffffff;
      color: #000000;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .popup.inverted {
      background: #000000;
      color: #ffffff;
      border-color: #ffffff;
    }
    .titlebar {
      background: #000080;
      color: #ffffff;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 6px;
      display: flex;
      justify-content: space-between;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .text { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
    .faces { font-size: 28px; letter-spacing: 6px; font-weight: bold; }
    #hint {
      position: fixed;
      bottom: 8px;
      left: 10px;
      font-size: 12px;
      opacity: 0.6;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="hint">Tap anywhere or press X to multiply (Home button to exit)</div>

  <!-- Replace src with a direct MP3 link to the classic audio clip -->
  <audio id="baseAudio" src="https://myinstants.com" preload="auto" loop></audio>

  <script>
    const popups = [];
    const maxPopups = 18; // Capped so the Switch's RAM doesn't freeze
    let flashState = false;

    // Flash colors every 250ms like the classic Flash animation
    setInterval(() => {
      flashState = !flashState;
      document.body.classList.toggle("inverted", flashState);
      popups.forEach(p => p.el.classList.toggle("inverted", flashState));
    }, 250);

    function playEchoLayer() {
      const base = document.getElementById("baseAudio");
      const clone = base.cloneNode(true);
      clone.volume = Math.max(0.15, 0.8 - popups.length * 0.04);
      // Slight playback rate offset creates the classic detuned echo chorus
      clone.playbackRate = 0.97 + Math.random() * 0.06;
      clone.play().catch(() => {});
    }

    function spawnPopup(x, y) {
      if (popups.length >= maxPopups) return;

      const el = document.createElement("div");
      el.className = "popup";
      el.innerHTML = `
        <div class="titlebar"><span>Idiot.exe</span><span>[X]</span></div>
        <div class="content">
          <div class="text">you are an idiot!</div>
          <div class="faces">☺ ☺ ☺</div>
        </div>
      `;

      const startX = x ?? Math.random() * (window.innerWidth - 270);
      const startY = y ?? Math.random() * (window.innerHeight - 180);
      el.style.left = startX + "px";
      el.style.top = startY + "px";

      // Clicking/tapping a popup spawns two more + adds an audio echo layer
      el.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        spawnPopup();
        spawnPopup();
      });

      document.body.appendChild(el);
      playEchoLayer();

      popups.push({
        el,
        x: startX,
        y: startY,
        vx: (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 3),
        vy: (Math.random() > 0.5 ? 1 : -1) * (3 + Math.random() * 3)
      });
    }

    // Bounce all popups around the Switch screen
    function animate() {
      const maxW = window.innerWidth - 260;
      const maxH = window.innerHeight - 170;

      for (const p of popups) {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x <= 0 || p.x >= maxW) p.vx *= -1;
        if (p.y <= 0 || p.y >= maxH) p.vy *= -1;

        p.el.style.left = p.x + "px";
        p.el.style.top = p.y + "px";
      }
      requestAnimationFrame(animate);
    }

    // First tap unlocks Switch audio and starts spawning
    document.body.addEventListener("pointerdown", () => {
      spawnPopup();
      spawnPopup();
    });

    // Spawn the initial window on load
    spawnPopup(window.innerWidth / 2 - 130, window.innerHeight / 2 - 85);
    animate();
  </script>
</body>
</html>
